---
# EPEL provides libXp-devel and motif-devel on Rocky 10
enablerepo: "epel"
system:
  - autoconf
  - cairo-devel
  - pixman-devel
  - libXmu-devel
  - libXaw-devel
  - flex-devel
  - expat-devel
  - libX11-devel
  - mesa-libGL-devel
  - zlib-devel
  - libtirpc-devel
  - libXp-devel
  - motif-devel
  - xorg-x11-fonts-misc
  - !OScmp ">=,10,xorg-x11-server-Xwayland,xorg-x11-server-Xvfb"
  - netpbm-progs
  - ed
  - !OScmp "<,10,libpng15,"
  - gsl-devel
bootstrap:
build:
manifest:
  - "{{bootstrap}}"
  - "{{build}}"
sets:
  - base
  - "2022"
